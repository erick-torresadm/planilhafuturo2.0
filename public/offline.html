<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — planilhafuturo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      background: #f8f9fc;
      color: #1a1d23;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem;
      text-align: center;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #7c818a; max-width: 20rem; line-height: 1.5; }
    .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
    .btn {
      display: inline-flex;
      align-items: center;
      margin-top: 1.5rem;
      padding: 0.625rem 1.25rem;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Sem conexão</h1>
  <p>Os dados exibidos podem estar desatualizados. Conecte-se à internet para carregar as informações mais recentes.</p>
  <a href="/app" class="btn">Tentar novamente</a>
</body>
</html>
